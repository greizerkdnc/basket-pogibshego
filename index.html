
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#100719">
<title>POGIBSHIY BASKET</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #100719;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  min-height: 100vh;
}

header {
  padding: 22px 10px 15px;
  background: linear-gradient(135deg,#170a25,#35134e);
  border-bottom: 1px solid #843cbd;
}

h1 {
  font-size: 25px;
  color: #d8a2ff;
  letter-spacing: 2px;
  margin: 0;
  text-shadow: 0 0 15px #a855f7;
}

.subtitle {
  color: #b88bd9;
  font-size: 11px;
  letter-spacing: 4px;
  margin-top: 7px;
}

#player {
  font-size: 13px;
  color: #d8b4fe;
  margin-top: 12px;
}

.stats {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 15px 5px;
}

.stat {
  background: #21112e;
  border: 1px solid #693b8c;
  border-radius: 12px;
  padding: 11px 15px;
  min-width: 95px;
  flex: 1;
  max-width: 125px;
}

.stat small {
  display: block;
  color: #b99acb;
  font-size: 10px;
  margin-bottom: 6px;
}

.stat strong {
  font-size: 22px;
}

canvas {
  display: block;
  width: 94%;
  max-width: 440px;
  margin: auto;
  border: 2px solid #9949d2;
  border-radius: 15px;
  background: #170b25;
  touch-action: none;
  box-shadow: 0 0 22px #6b21a855;
}

#status {
  color: #d8b4fe;
  font-size: 14px;
  min-height: 23px;
  margin: 13px;
}

button {
  border: 1px solid #c084fc;
  border-radius: 12px;
  background: linear-gradient(135deg,#9333ea,#6b21a8);
  color: white;
  font-weight: bold;
  padding: 15px 25px;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 0 0 15px #9333ea55;
}

button:active {
  transform: scale(.97);
}

button:disabled {
  opacity: .4;
}

.panel {
  width: 94%;
  max-width: 440px;
  margin: 15px auto;
  background: #21112e;
  border: 1px solid #593176;
  border-radius: 13px;
  padding: 15px;
}

.panel h3 {
  margin: 0 0 12px;
  color: #d8a2ff;
}

#leaderboard {
  color: #e9d5ff;
  font-size: 13px;
  line-height: 2;
}

footer {
  color: #775d8d;
  font-size: 10px;
  padding: 20px;
}
</style>
</head>

<body>

<header>
  <h1>🏀 POGIBSHIY</h1>
  <div class="subtitle">BASKETBALL ARCADE</div>
  <div id="player">PLAYER</div>
</header>

<div class="stats">
  <div class="stat">
    <small>ОЧКИ</small>
    <strong id="score">0</strong>
  </div>

  <div class="stat">
    <small>ВРЕМЯ</small>
    <strong id="timer">60</strong>
  </div>

  <div class="stat">
    <small>РЕКОРД</small>
    <strong id="best">0</strong>
  </div>
</div>

<canvas id="game" width="420" height="580"></canvas>

<div id="status">Нажми «НАЧАТЬ ИГРУ»</div>

<button id="start">🏀 НАЧАТЬ ИГРУ</button>

<div class="panel">
  <h3>🏆 ТВОЯ СТАТИСТИКА</h3>
  <div id="stats">Попадания: 0</div>
</div>

<footer>
  POGIBSHIY BASKETBALL PROJECT · 2026
</footer>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreElement = document.getElementById("score");
const timerElement = document.getElementById("timer");
const bestElement = document.getElementById("best");
const statusElement = document.getElementById("status");
const playerElement = document.getElementById("player");
const startButton = document.getElementById("start");
const statsElement = document.getElementById("stats");

const STORAGE_KEY = "pogibshiy_basket_best";

let score = 0;
let best = Number(localStorage.getItem(STORAGE_KEY) || 0);
let timeLeft = 60;
let playing = false;
let dragging = false;
let lastFrame = 0;
let timer = 0;
let combo = 0;
let shots = 0;
let hits = 0;
let shotScored = false;
let particles = [];

bestElement.textContent = best;

const ball = {
  x: 75,
  y: 490,
  vx: 0,
  vy: 0,
  radius: 17,
  flying: false
};

const hoop = {
  left: 290,
  right: 370,
  y: 260
};

let aim = {x:75,y:490};

function setPlayer() {
  const user = tg?.initDataUnsafe?.user;

  playerElement.textContent = user
    ? "PLAYER: " + user.first_name
    : "PLAYER: GUEST";
}

function resetBall() {
  ball.x = 75;
  ball.y = 490;
  ball.vx = 0;
  ball.vy = 0;
  ball.flying = false;
  shotScored = false;
}

function startGame() {
  if (playing) return;

  score = 0;
  combo = 0;
  shots = 0;
  hits = 0;
  timeLeft = 60;

  scoreElement.textContent = 0;
  timerElement.textContent = 60;
  statsElement.textContent = "Попадания: 0";
  statusElement.textContent = "Потяни мяч назад и отпусти!";

  playing = true;
  startButton.disabled = true;

  resetBall();

  clearInterval(timer);

  timer = setInterval(() => {
    if (!playing) return;

    timeLeft--;
    timerElement.textContent = timeLeft;

    if (timeLeft <= 0) endGame();
  }, 1000);
}

function endGame() {
  playing = false;
  clearInterval(timer);

  startButton.disabled = false;

  if (score > best) {
    best = score;
    localStorage.setItem(STORAGE_KEY, best);
    bestElement.textContent = best;
  }

  statusElement.textContent =
    "МАТЧ ОКОНЧЕН! ТВОЙ РЕЗУЛЬТАТ: " + score;

  statsElement.textContent =
    "Попадания: " + hits + " | Броски: " + shots;

  tg?.HapticFeedback?.notificationOccurred("success");
}

function drawCourt() {
  const gradient = ctx.createLinearGradient(0,0,0,580);

  gradient.addColorStop(0,"#321348");
  gradient.addColorStop(1,"#100719");

  ctx.fillStyle = gradient;
  ctx.fillRect(0,0,420,580);

  // Фоновые огни
  for (let i=0;i<20;i++) {
    ctx.fillStyle = "rgba(192,132,252,.18)";
    ctx.fillRect((i*73)%420,(i*41)%210,2,2);
  }

  // Пол
  ctx.strokeStyle = "#a855f7";
  ctx.lineWidth = 3;

  ctx.beginPath();
  ctx.moveTo(0,550);
  ctx.lineTo(420,550);
  ctx.stroke();

  // Центральная линия
  ctx.strokeStyle = "#643b80";
  ctx.lineWidth = 1;

  ctx.beginPath();
  ctx.arc(210,550,100,Math.PI,Math.PI*2);
  ctx.stroke();

  // Щит
  ctx.fillStyle = "#e9d5ff";
  ctx.fillRect(367,165,8,110);

  // Кольцо
  ctx.strokeStyle = "#fb923c";
  ctx.lineWidth = 6;

  ctx.beginPath();
  ctx.moveTo(hoop.left,hoop.y);
  ctx.lineTo(hoop.right,hoop.y);
  ctx.stroke();

  // Сетка
  ctx.strokeStyle = "#d8b4fe";
  ctx.lineWidth = 1.5;

  for(let i=0;i<=5;i++) {
    let x=295+i*14;

    ctx.beginPath();
    ctx.moveTo(x,hoop.y);
    ctx.lineTo(310+i*10,hoop.y+43);
    ctx.stroke();
  }
}

function drawBall() {
  ctx.save();
  ctx.translate(ball.x,ball.y);

  ctx.shadowColor = "#f97316";
  ctx.shadowBlur = 12;

  ctx.fillStyle = "#f97316";
  ctx.beginPath();
  ctx.arc(0,0,ball.radius,0,Math.PI*2);
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.strokeStyle = "#5b250b";
  ctx.lineWidth = 2;

  ctx.beginPath();
  ctx.moveTo(-17,0);
  ctx.lineTo(17,0);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(-5,0,12,-1.2,1.2);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(5,0,12,1.9,4.3);
  ctx.stroke();

  ctx.restore();
}

function drawAim() {
  if(!dragging) return;

  ctx.strokeStyle = "#d8b4fe";
  ctx.lineWidth = 3;
  ctx.setLineDash([7,6]);

  ctx.beginPath();
  ctx.moveTo(ball.x,ball.y);
  ctx.lineTo(aim.x,aim.y);
  ctx.stroke();

  ctx.setLineDash([]);
}

function createParticles(x,y) {
  for(let i=0;i<18;i++) {
    particles.push({
      x,y,
      vx:(Math.random()-.5)*5,
      vy:(Math.random()-.5)*5,
      life:30
    });
  }
}

function drawParticles() {
  particles.forEach(p => {
    ctx.fillStyle = "#c084fc";
    ctx.globalAlpha = p.life/30;
    ctx.fillRect(p.x,p.y,4,4);
    ctx.globalAlpha = 1;
  });
}

function updateParticles() {
  particles = particles.filter(p => p.life>0);

  particles.forEach(p => {
    p.x+=p.vx;
    p.y+=p.vy;
    p.life--;
  });
}

function update(dt) {
  if(!ball.flying || !playing) return;

  const oldY=ball.y;

  ball.vy+=.32*dt;
  ball.x+=ball.vx*dt;
  ball.y+=ball.vy*dt;

  // Попадание
  if(
    !shotScored &&
    oldY<hoop.y &&
    ball.y>=hoop.y &&
    ball.vy>0 &&
    ball.x>hoop.left+12 &&
    ball.x<hoop.right-12
  ) {
    score++;
    hits++;
    combo++;

    let bonus=combo>=3?2:1;
    score+=bonus-1;

    scoreElement.textContent=score;
    statsElement.textContent="Попадания: "+hits+" | Комбо: "+combo;

    statusElement.textContent =
      combo>=3?"🔥 COMBO x"+combo:"ЧИСТОЕ ПОПАДАНИЕ!";

    shotScored=true;

    createParticles(ball.x,ball.y);

    tg?.HapticFeedback?.notificationOccurred("success");
  }

  // Пол
  if(ball.y+ball.radius>550) {
    ball.y=550-ball.radius;
    ball.vy*=-.62;
    ball.vx*=.83;

    if(Math.abs(ball.vy)<1.5) ball.vy=0;
  }

  // Щит
  if(
    ball.x+ball.radius>367 &&
    ball.x-ball.radius<375 &&
    ball.y>165 &&
    ball.y<275 &&
    ball.vx>0
  ) {
    ball.x=367-ball.radius;
    ball.vx*=-.7;
  }

  // Стены
  if(ball.x<ball.radius) {
    ball.x=ball.radius;
    ball.vx*=-.7;
  }

  if(ball.x>420-ball.radius) {
    ball.x=420-ball.radius;
    ball.vx*=-.7;
  }

  // Остановка мяча
  if(
    ball.y>=550-ball.radius &&
    Math.abs(ball.vy)<1.5 &&
    Math.abs(ball.vx)<.4
  ) {
    resetBall();
  }

  if(ball.y>650 || ball.x<-100 || ball.x>520) {
    resetBall();
  }
}

function draw() {
  drawCourt();
  drawParticles();
  drawAim();
  drawBall();
}

function frame(timestamp) {
  const dt=lastFrame
    ? Math.min((timestamp-lastFrame)/16.67,2)
    : 1;

  lastFrame=timestamp;

  update(dt);
  updateParticles();
  draw();

  requestAnimationFrame(frame);
}

function pointerPosition(e) {
  const rect=canvas.getBoundingClientRect();

  return {
    x:(e.clientX-rect.left)*420/rect.width,
    y:(e.clientY-rect.top)*580/rect.height
  };
}

canvas.addEventListener("pointerdown",e=>{
  if(!playing || ball.flying) return;

  const p=pointerPosition(e);

  if(Math.hypot(p.x-ball.x,p.y-ball.y)<55) {
    dragging=true;
    aim=p;
    canvas.setPointerCapture(e.pointerId);
  }
});

canvas.addEventListener("pointermove",e=>{
  if(dragging) aim=pointerPosition(e);
});

canvas.addEventListener("pointerup",()=>{
  if(!dragging) return;

  dragging=false;

  let dx=ball.x-aim.x;
  let dy=ball.y-aim.y;

  const length=Math.hypot(dx,dy);
  const max=140;

  if(length>max) {
    dx*=max/length;
    dy*=max/length;
  }

  if(length<10) return;

  shots++;
  combo=0;
  ball.vx=dx*.13;
  ball.vy=dy*.13;
  ball.flying=true;
  shotScored=false;

  tg?.HapticFeedback?.impactOccurred("light");
});

startButton.addEventListener("click",startGame);

setPlayer();
draw();
requestAnimationFrame(frame);
</script>

</body>
</html>
